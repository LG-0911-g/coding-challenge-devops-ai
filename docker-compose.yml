
services:
  api:
    build:
      context: .
      dockerfile: src/CodingChallenge.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Data Source=/app/data/codingchallenge.db"
    volumes:
      - sqlite-data:/app/data

  web:
    build:
      context: .
      dockerfile: src/CodingChallenge.Web/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: http://api:8080
    depends_on:
      - api

volumes:
  sqlite-data:
